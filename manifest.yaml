name: nightfang
version: "2.0"
type: security-capability-pack
description: "Comprehensive autonomous security assessment, penetration testing, and purple-teaming capability pack for host agent runtimes."

runtime:
  name: hermes
  min_version: "0.2.0"
  entrypoint:
    agent: AGENTS.md
  capabilities:
    agents: true
    skills: true
    workflows: true
    schemas: true

capabilities:
  - id: attack-surface-mapping
    description: "Passive intelligence gathering and active network/service discovery"
    target_types: [domain, cidr, ip_range, hostname, asset_inventory]
    workflow: workflows/standard-pentest.md
    agent: agents/recon.md
    skills:
      - skills/recon

  - id: web-application-security
    description: "OWASP Top 10, injection flaws, access control, and SPA assessment"
    target_types: [web_app, url, http, https, spa, cms]
    workflow: workflows/web-assessment.md
    agent: agents/scanner.md
    skills:
      - skills/web
      - skills/hunting

  - id: api-security
    description: "REST, GraphQL, and gRPC endpoints, BOLA/BFLA, mass assignment, and JWT"
    target_types: [rest_api, graphql, grpc, openapi, swagger, json_api]
    workflow: workflows/api-assessment.md
    agent: agents/scanner.md
    skills:
      - skills/api
      - skills/hunting

  - id: network-infrastructure-security
    description: "Network services, open ports, SMB/SNMP, known CVEs, and SSL/TLS ciphers"
    target_types: [network_host, subnet, port_service, tls_endpoint]
    workflow: workflows/standard-pentest.md
    agent: agents/scanner.md
    skills:
      - skills/network

  - id: cloud-security
    description: "AWS/Azure/GCP audits, S3 buckets, IMDSv1/v2 SSRF extraction, and IAM"
    target_types: [aws, azure, gcp, s3_bucket, imds, cloud_tenant]
    workflow: workflows/cloud-assessment.md
    agent: agents/cloud-security.md
    skills:
      - skills/cloud
      - skills/container

  - id: container-kubernetes-security
    description: "Container breakout vectors, Kubernetes RBAC, and admission control"
    target_types: [docker_host, k8s_cluster, container_registry, helm_chart, k8s_manifest]
    workflow: workflows/cloud-assessment.md
    agent: agents/container-breakout.md
    skills:
      - skills/container
      - skills/privilege-escalation

  - id: cicd-pipeline-security
    description: "CI/CD workflow poisoning, runner isolation, OIDC abuse, and secrets hygiene"
    target_types: [github_actions, gitlab_ci, jenkins, azure_devops, circleci]
    workflow: workflows/cicd-assessment.md
    agent: agents/cicd-redteam.md
    skills:
      - skills/cicd
      - skills/supply-chain

  - id: active-directory-security
    description: "Active Directory domain assessment — Kerberos, ACLs, ADCS, and delegation"
    target_types: [ad_domain, ad_forest, domain_controller, ldap, kerberos, adcs]
    workflow: workflows/ad-assessment.md
    agent: agents/ad-attacker.md
    skills:
      - skills/active-directory
      - skills/privilege-escalation

  - id: wireless-security
    description: "WiFi 802.11, WPA2/WPA3, Enterprise 802.1X, BLE GATT, and RF recon"
    target_types: [wifi_ap, wifi_client, ble_device, zigbee_mesh, z_wave, lorawan]
    workflow: workflows/wireless-assessment.md
    agent: agents/wireless-pentester.md
    skills:
      - skills/wireless
      - skills/iot

  - id: mobile-security
    description: "Android (APK) and iOS (IPA) application security per OWASP MASVS v2.0"
    target_types: [android_app, ios_app, apk, ipa, mobile_backend]
    workflow: workflows/mobile-assessment.md
    agent: agents/mobile-pentester.md
    skills:
      - skills/mobile
      - skills/api
      - skills/crypto

  - id: iot-embedded-security
    description: "Embedded firmware, hardware interfaces (UART/JTAG/SPI), and MQTT/CoAP"
    target_types: [iot_device, firmware, hardware_interface, mqtt_broker, coap_endpoint]
    workflow: workflows/iot-ics-assessment.md
    agent: agents/iot-pentester.md
    skills:
      - skills/iot
      - skills/wireless

  - id: ot-ics-security
    description: "Purdue model, industrial protocols (Modbus, S7comm, DNP3), and IEC 62443"
    target_types: [plc, rtu, historian, hmi, scada_server, industrial_network, safety_system]
    workflow: workflows/iot-ics-assessment.md
    agent: agents/scada-attacker.md
    skills:
      - skills/ot-ics
      - skills/network

  - id: cryptographic-security
    description: "TLS cipher auditing, JWT implementation flaws, padding oracles, and PQC"
    target_types: [tls_endpoint, certificate, jwt_token, crypto_implementation, pqc_migration]
    workflow: workflows/standard-pentest.md
    agent: agents/crypto-analyzer.md
    skills:
      - skills/crypto
      - skills/api

  - id: privilege-escalation
    description: "Linux and Windows local privilege escalation (SUID, sudo, tokens, services)"
    target_types: [linux_host, windows_host, container, endpoint_shell]
    workflow: workflows/standard-pentest.md
    agent: agents/privesc-advisor.md
    skills:
      - skills/privilege-escalation

  - id: post-exploitation
    description: "Lateral movement, network pivoting, egress/DLP testing, and persistence"
    target_types: [compromised_host, internal_subnet, pivot_point]
    workflow: workflows/standard-pentest.md
    agent: agents/lateral-movement.md
    skills:
      - skills/post-exploitation
      - skills/network

  - id: forensics-incident-response
    description: "Memory forensics (Volatility), timeline reconstruction, disk artifacts, and YARA"
    target_types: [memory_dump, disk_image, log_archive, malware_sample, pcap]
    workflow: workflows/standard-pentest.md
    agent: agents/forensics-analyst.md
    skills:
      - skills/forensics

  - id: supply-chain-security
    description: "SBOM analysis (SPDX/CycloneDX), dependency confusion, and SLSA provenance"
    target_types: [git_repo, package_lockfile, sbom, container_image, ci_cd_pipeline]
    workflow: workflows/supply-chain-assessment.md
    agent: agents/supply-chain-auditor.md
    skills:
      - skills/supply-chain
      - skills/cicd

  - id: grc-compliance
    description: "Regulatory crosswalks (NIST CSF 2.0, ISO 27001, SOC 2, CIS v8, PCI-DSS v4.0)"
    target_types: [organization, control_set, audit_scope, policy_repo]
    workflow: workflows/standard-pentest.md
    agent: agents/compliance-mapper.md
    skills:
      - skills/grc
      - skills/reporting

  - id: threat-intelligence
    description: "Intelligence cycle, IOC normalization, STIX 2.1, Diamond Model, and TLP 2.0"
    target_types: [threat_report, ioc_feed, malware_sample, actor_profile, campaign]
    workflow: workflows/standard-pentest.md
    agent: agents/cti-analyst.md
    skills:
      - skills/cti
      - skills/reporting

  - id: purple-team-adversary-emulation
    description: "Atomic emulation, detect-tune-validate loop, MTTD measurement, and Sigma rules"
    target_types: [detection_rules, sim_environment, attck_technique, atomic_test]
    workflow: workflows/purple-team.md
    agent: agents/purple-team-operator.md
    skills:
      - skills/purple-team
      - skills/remediation
      - skills/cti

  - id: ai-llm-security
    description: "Adversarial prompt injection, agentic tool abuse, and MCP server audits"
    target_types: [llm, agent, mcp_server, prompt_interface, rag]
    workflow: workflows/ai-security-assessment.md
    agent: agents/ai-security.md
    skills:
      - skills/ai-security

  - id: exploit-validation
    description: "Controlled non-destructive PoC verification under strict HITL approval"
    target_types: [candidate_finding, unverified_exploit]
    workflow: workflows/standard-pentest.md
    agent: agents/validation.md
    skills:
      - skills/attack-chain
      - skills/remediation

  - id: security-reporting
    description: "Finding aggregation, attack chain visualization, and D3FEND remediation roadmap"
    target_types: [engagement_findings, audit_deliverable]
    workflow: workflows/standard-pentest.md
    agent: agents/reporter.md
    skills:
      - skills/reporting
      - skills/remediation

  - id: utility-operations
    description: "Rapid triage checklists, engagement memory, and finding QA validation"
    target_types: [engagement_request, scope_document, target_inventory]
    workflow: workflows/standard-pentest.md
    agent: agents/engagement-planner.md
    skills:
      - skills/utility
      - skills/recon

  - id: defense-evasion-assessment
    description: "Endpoint security evasion, AMSI/ETW telemetry auditing, process injection, and LOLBAS"
    target_types: [endpoint_host, edr_policy, workstation_image, process_telemetry, lolbas_candidate]
    workflow: workflows/purple-team.md
    agent: agents/evasion-specialist.md
    skills:
      - skills/defense-evasion
      - skills/privilege-escalation

  - id: command-and-control-resilience
    description: "C2 infrastructure, redirector architecture, malleable traffic profiles, and covert egress"
    target_types: [c2_infrastructure, egress_boundary, network_perimeter, covert_channel, proxy_gateway]
    workflow: workflows/purple-team.md
    agent: agents/c2-operator.md
    skills:
      - skills/c2-operations
      - skills/post-exploitation

  - id: initial-access-assessment
    description: "Perimeter gateways (VPN/SSO), container delivery (ISO/MOTW), and DLL sideloading"
    target_types: [vpn_gateway, remote_access, perimeter_portal, payload_delivery, motw_container]
    workflow: workflows/standard-pentest.md
    agent: agents/recon.md
    skills:
      - skills/initial-access
      - skills/recon

  - id: credential-access-security
    description: "Host LSASS memory dumping resistance, SAM/DPAPI vaults, and token/PRT session theft"
    target_types: [lsass_memory, credential_vault, sam_database, dpapi_store, session_token]
    workflow: workflows/standard-pentest.md
    agent: agents/privesc-advisor.md
    skills:
      - skills/credential-access
      - skills/privilege-escalation


