  - agents/recon.md
  - agents/scanner.md
  - agents/ai-security.md
  - agents/validation.md
  - agents/reporter.md
  - agents/ad-attacker.md
  - agents/cloud-security.md
  - agents/container-breakout.md
  - agents/cicd-redteam.md
  - agents/mobile-pentester.md
  - agents/wireless-pentester.md
  - agents/iot-pentester.md
  - agents/scada-attacker.md
  - agents/crypto-analyzer.md
  - agents/forensics-analyst.md
  - agents/supply-chain-auditor.md
  - agents/compliance-mapper.md
  - agents/cti-analyst.md
  - agents/purple-team-operator.md
  - agents/detection-engineer.md
  - agents/threat-modeler.md
  - agents/privesc-advisor.md
  - agents/lateral-movement.md
  - agents/code-auditor.md
  - agents/risk-scorer.md
  - agents/fix-verifier.md
  - agents/engagement-planner.md
  - agents/evasion-specialist.md
  - agents/c2-operator.md

agent_taxonomy:
  direct:
    description: "Reachable directly through manifest capabilities[] routing table (24 agents covering 28 capabilities)"
    agents:
      - id: recon
        path: agents/recon.md
        capabilities: [attack-surface-mapping, initial-access-assessment]
      - id: scanner
        path: agents/scanner.md
        capabilities: [web-application-security, api-security, network-infrastructure-security]
      - id: cloud-security
        path: agents/cloud-security.md
        capabilities: [cloud-security]
      - id: container-breakout
        path: agents/container-breakout.md
        capabilities: [container-kubernetes-security]
      - id: cicd-redteam
        path: agents/cicd-redteam.md
        capabilities: [cicd-pipeline-security]
      - id: ad-attacker
        path: agents/ad-attacker.md
        capabilities: [active-directory-security]
      - id: wireless-pentester
        path: agents/wireless-pentester.md
        capabilities: [wireless-security]
      - id: mobile-pentester
        path: agents/mobile-pentester.md
        capabilities: [mobile-security]
      - id: iot-pentester
        path: agents/iot-pentester.md
        capabilities: [iot-embedded-security]
      - id: scada-attacker
        path: agents/scada-attacker.md
        capabilities: [ot-ics-security]
      - id: crypto-analyzer
        path: agents/crypto-analyzer.md
        capabilities: [cryptographic-security]
      - id: privesc-advisor
        path: agents/privesc-advisor.md
        capabilities: [privilege-escalation, credential-access-security]
      - id: lateral-movement
        path: agents/lateral-movement.md
        capabilities: [post-exploitation]
      - id: forensics-analyst
        path: agents/forensics-analyst.md
        capabilities: [forensics-incident-response]
      - id: supply-chain-auditor
        path: agents/supply-chain-auditor.md
        capabilities: [supply-chain-security]
      - id: compliance-mapper
        path: agents/compliance-mapper.md
        capabilities: [grc-compliance]
      - id: cti-analyst
        path: agents/cti-analyst.md
        capabilities: [threat-intelligence]
      - id: purple-team-operator
        path: agents/purple-team-operator.md
        capabilities: [purple-team-adversary-emulation]
      - id: ai-security
        path: agents/ai-security.md
        capabilities: [ai-llm-security]
      - id: validation
        path: agents/validation.md
        capabilities: [exploit-validation]
      - id: reporter
        path: agents/reporter.md
        capabilities: [security-reporting]
      - id: engagement-planner
        path: agents/engagement-planner.md
        capabilities: [utility-operations]
      - id: evasion-specialist
        path: agents/evasion-specialist.md
        capabilities: [defense-evasion-assessment]
      - id: c2-operator
        path: agents/c2-operator.md
        capabilities: [command-and-control-resilience]
  delegated:
    description: "Invoked downstream by workflows, primary agents, or purple-team loops (5 specialist agents)"
    agents:
      - id: detection-engineer
        path: agents/detection-engineer.md
        invoked_by: [workflows/purple-team.md, agents/reporter.md, agents/purple-team-operator.md]
        purpose: "Translates offensive findings into defensive Sigma, Sentinel KQL, and Splunk SPL queries"
      - id: threat-modeler
        path: agents/threat-modeler.md
        invoked_by: [workflows/standard-pentest.md, workflows/web-assessment.md, workflows/cloud-assessment.md]
        purpose: "Pre-attack architectural trust boundary and data flow decomposition (STRIDE/PASTA)"
      - id: code-auditor
        path: agents/code-auditor.md
        invoked_by: [workflows/supply-chain-assessment.md, workflows/cicd-assessment.md, workflows/web-assessment.md]
        purpose: "Static source code analysis (SAST) and sink-to-source taint tracking"
      - id: risk-scorer
        path: agents/risk-scorer.md
        invoked_by: [workflows/standard-pentest.md, agents/reporter.md]
        purpose: "Quantitative risk calibration (CVSS v3.1/v4.0, EPSS, CISA KEV, Priority SLAs)"
      - id: fix-verifier
        path: agents/fix-verifier.md
        invoked_by: [workflows/standard-pentest.md, workflows/web-assessment.md]
        purpose: "Post-remediation patch validation and regression testing"

