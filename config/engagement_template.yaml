# NIGHTFANG Engagement Configuration Template
# Tuned to .env: secrets automatically resolve from your .env file!

engagement:
  name: "Security Assessment"
  client: "Target Client"
  type: "blackbox"       # blackbox | greybox | whitebox
  start_date: ""         # YYYY-MM-DD
  end_date: ""           # YYYY-MM-DD
  operator: "${NIGHTFANG_OPERATOR:@SecurityLead}"

# Scope Definition
scope:
  in_scope:
    domains:
      - "*.example.com"
      - "api.example.com"
    ips:
      - "192.168.1.0/24"
    urls:
      - "https://app.example.com/*"
      - "https://api.example.com/v1/*"
    ports:
      - "80,443,8080,8443"

  out_of_scope:
    domains:
      - "production-db.example.com"
      - "payments.example.com"
    ips:
      - "192.168.1.1"
    urls:
      - "*/admin/purge*"
    notes:
      - "No denial of service or resource exhaustion testing."
      - "Do not alter live financial records."

# Credentials (if greybox/whitebox)
credentials: []
  # - role: "regular_user"
  #   username: "${TEST_USER_NAME}"
  #   password: "${TEST_USER_PASSWORD}"

# Rules of Engagement & Performance
rules:
  testing_window: "24/7"
  max_scan_rate: 100     # requests per second
  stealth_mode: false    # true = slower, stealthier scans
  auto_exploit: false    # ALWAYS FALSE - exploitation requires HITL /go approval
  
  # Token Optimization (Caveman Mode) — Toggleable via /terse on|off or .env
  token_efficiency: ${NIGHTFANG_TOKEN_EFFICIENCY:false}
  
  allowed_techniques:
    - passive_recon
    - active_recon
    - vulnerability_scanning
    - web_app_testing
    - api_testing
    - ai_llm_testing
    - network_testing
    - cloud_testing
  
  reporting:
    format: "markdown"
    telegram_updates: true
    update_frequency: "per_finding"
    include_evidence: true
    map_mitre_attack: true
    map_d3fend: true

# Primary Telegram Bot (Sole Communication & HITL Channel)
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
  notify_on:
    - findings
    - phase_changes
    - permission_requests
    - engagement_complete

# Agent Swarm Configuration
agent:
  max_concurrent_agents: ${NIGHTFANG_MAX_CONCURRENT_AGENTS:7}
  timeout_per_task: 3600
  retry_on_failure: true
  max_retries: 3
  mcp_config_path: "config/mcp_servers.yaml"
