    - personal-context
    - operator-prefs
  inputs:
    - all_findings
    - evidence_artifacts
    - attack_chains
    - operator_decisions
    - engagement_timeline
    - personal_report_template    # NIGHTFANG: templates/personal_report_template.md
    - remediation_style           # NIGHTFANG: Code-level, architectural, strategic
  outputs:
    - executive_report
    - technical_report
    - remediation_roadmap
    - telegram_summary
    - jira_tickets                # NIGHTFANG: Auto-create if configured
    - github_issues               # NIGHTFANG: Auto-create if configured
  hitl_required: false
  max_runtime_minutes: 45
  priority: 5
  depends_on:
    - nightfang_scanner_webapp_agent
    - nightfang_scanner_api_agent
    - nightfang_scanner_ai_agent
    - nightfang_scanner_network_agent
    - nightfang_scanner_ssl_agent
    - nightfang_scanner_vuln_agent
