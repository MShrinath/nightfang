    report_template: "templates/personal_report_template.md"
    finding_template: "templates/personal_finding_template.md"
    executive_voice: "direct_actionable"
    technical_depth: "full_reproduction"
    remediation_format: "code_config_architecture"
    framework_mappings: ["MITRE_ATTACK", "MITRE_ATLAS", "MITRE_D3FEND", "NIST_CSF", "NIST_AI_RMF", "CWE", "OWASP", "CVSS31"]

