nightfang_orchestrator:
  name: "NIGHTFANG"
  role: "Personal Engagement Orchestrator"
  description: >-
    Master orchestrator extending NIGHTFANG with personal memory,
    operator preferences, learned patterns, and calibrated tooling.
  inherits: "nightfang_orchestrator"
  skills:
    - scope-management
    - memory-management
    - telegram-hitl
    - token-optimizer
    - attack-chain-analysis
    - evidence-collection
    - reporting
    - personal-context
    - operator-prefs
    - custom-tooling
  agent_spawn_order:
    phase_1_recon:
      - nightfang_recon_passive_agent
    phase_2_active_recon:
      - nightfang_recon_active_agent
    phase_3_scanning:
      - nightfang_scanner_webapp_agent
      - nightfang_scanner_api_agent
      - nightfang_scanner_ai_agent
      - network_scanner_agent
      - ssl_scanner_agent
      - vuln_scanner_agent
      - cloud_scanner_agent
    phase_4_analysis:
      - nightfang_hunter_agent
    phase_5_exploitation:
      - nightfang_exploiter_agent
    phase_6_reporting:
      - nightfang_reporter_agent