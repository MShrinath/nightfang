# NIGHTFANG Subagent Definitions
# Defines each specialized swarm agent that NIGHTFANG can spawn

# ═══════════════════════════════════════════════════════════
# RECON SWARM
# ═══════════════════════════════════════════════════════════

recon_passive_agent:
  name: "RECON-PASSIVE"
  role: "Passive Reconnaissance Specialist"
  description: >-
    Gathers intelligence without sending traffic to the target.
    Performs OSINT, DNS enumeration, subdomain discovery, certificate
    transparency analysis, and technology fingerprinting.
  frameworks:
    mitre_attack: [T1593, T1594, T1596]
    nist_csf: [ID.AM-01, ID.RA-01]
    d3fend: [D3-DNST, D3-WHIA]
  skills:
    - recon-passive
    - scope-management
    - memory-management
    - evidence-collection
  tools_required:
    - whois
    - dig
    - nslookup
    - subfinder
    - amass
    - theHarvester
    - shodan
    - wafw00f
    - whatweb
    - dnsrecon
  inputs:
    - scope_definition
    - target_domains
    - target_organization_name
  outputs:
    - subdomain_list
    - dns_records
    - technology_stack
    - whois_data
    - certificate_inventory
    - attack_surface_map
  hitl_required: false
  max_runtime_minutes: 30
  priority: 1

recon_active_agent:
  name: "RECON-ACTIVE"
  role: "Active Reconnaissance Specialist"
  description: >-
    Performs direct scanning against authorized targets. Port scanning,
    service enumeration, version detection, OS fingerprinting.
  frameworks:
    mitre_attack: [T1046, T1595, T1018]
    nist_csf: [ID.AM-02, DE.CM-01]
    d3fend: [D3-NTA, D3-SDA]
  skills:
    - recon-active
    - scope-management
    - memory-management
    - evidence-collection
  tools_required:
    - nmap
    - masscan
    - rustscan
    - enum4linux
    - snmpwalk
    - nbtscan
  inputs:
    - scope_definition
    - passive_recon_results
    - scan_aggressiveness_preference
  outputs:
    - host_inventory
    - port_service_map
    - os_fingerprints
    - nse_script_results
    - entry_point_list
  hitl_required: true
  hitl_message: "Ready to begin active scanning of {target_count} hosts. Estimated time: {est_time}. Proceed?"
  max_runtime_minutes: 60
  priority: 2
  depends_on:
    - recon_passive_agent

# ═══════════════════════════════════════════════════════════
# SCANNER SWARM
# ═══════════════════════════════════════════════════════════

webapp_scanner_agent:
  name: "SCANNER-WEBAPP"
  role: "Web Application Security Tester"
  description: >-
    Tests web applications against OWASP Top 10. SQLi, XSS, CSRF,
    IDOR, SSRF, authentication bypass, directory traversal, and more.
  frameworks:
    mitre_attack: [T1190, T1059.007, T1505]
    nist_csf: [PR.DS-01, DE.CM-01]
    d3fend: [D3-PSA, D3-WAF]
  skills:
    - webapp-testing
    - scope-management
    - memory-management
    - evidence-collection
  tools_required:
    - nikto
    - gobuster
    - ffuf
    - sqlmap
    - nuclei
    - dalfox
    - commix
    - katana
    - arjun
    - paramspider
    - wpscan
    - jwt_tool
  inputs:
    - scope_definition
    - web_endpoints_list
    - credentials
    - technology_stack
  outputs:
    - vulnerability_findings
    - injection_test_results
    - access_control_findings
    - session_management_findings
    - evidence_artifacts
  hitl_required: true
  hitl_checkpoints:
    - "Before SQLMap exploitation (--os-shell, --dump)"
    - "Before command injection exploitation"
    - "Before any file upload testing with shells"
  max_runtime_minutes: 120
  priority: 3
  depends_on:
    - recon_active_agent

api_scanner_agent:
  name: "SCANNER-API"
  role: "API Security Tester"
  description: >-
    Tests REST, GraphQL, gRPC, and SOAP APIs against OWASP API Top 10.
    BOLA, broken authentication, mass assignment, rate limiting bypass.
  frameworks:
    mitre_attack: [T1190, T1078, T1552]
    nist_csf: [PR.AC-01, PR.DS-02]
    d3fend: [D3-ARA, D3-PSA]
  skills:
    - api-testing
    - scope-management
    - memory-management
    - evidence-collection
  tools_required:
    - curl
    - httpie
    - ffuf
    - arjun
    - kiterunner
    - graphql-cop
    - jwt_tool
    - mitmproxy
    - nuclei
  inputs:
    - scope_definition
    - api_endpoints
    - api_documentation
    - auth_tokens
  outputs:
    - endpoint_inventory
    - bola_findings
    - auth_findings
    - rate_limit_findings
    - injection_findings
    - poc_curl_commands
  hitl_required: true
  hitl_checkpoints:
    - "Before any data modification attempts"
    - "Before brute-force/enumeration attacks"
  max_runtime_minutes: 90
  priority: 3
  depends_on:
    - recon_active_agent

ai_scanner_agent:
  name: "SCANNER-AI"
  role: "LLM & AI Security Specialist"
  description: >-
    Audits AI chatbots, generative API endpoints, MCP tool-calling workflows,
    and agentic pipelines against MITRE ATLAS and OWASP Top 10 for LLMs.
  frameworks:
    mitre_atlas: [AML.T0051, AML.T0054, AML.T0043, AML.T0040, AML.T0048]
    mitre_attack: [T1190, T1059]
    nist_ai_rmf: [MAP-1.5, MEASURE-2.6, MANAGE-2.4]
    d3fend: [D3-PSA, D3-MCI]
  skills:
    - llm-ai-security
    - scope-management
    - memory-management
    - evidence-collection
  tools_required:
    - curl
    - requests
  inputs:
    - scope_definition
    - ai_endpoints
    - tool_schemas
  outputs:
    - prompt_injection_findings
    - system_prompt_extraction_findings
    - insecure_output_findings
    - mcp_tool_tampering_findings
  hitl_required: true
  hitl_checkpoints:
    - "Before testing state-changing tool executions via LLM"
  max_runtime_minutes: 60
  priority: 3
  depends_on:
    - recon_active_agent

network_scanner_agent:
  name: "SCANNER-NETWORK"
  role: "Network Security Tester"
  description: >-
    Tests network services, protocols, and infrastructure. Service
    exploitation, credential testing, AD enumeration.
  frameworks:
    mitre_attack: [T1021, T1110, T1558]
    nist_csf: [PR.AC-05, PR.PT-01]
    d3fend: [D3-NA, D3-BA]
  skills:
    - network-testing
    - scope-management
    - memory-management
    - evidence-collection
  tools_required:
    - metasploit
    - hydra
    - crackmapexec
    - responder
    - impacket
    - enum4linux
    - smbclient
    - rpcclient
    - kerbrute
    - bloodhound
  inputs:
    - scope_definition
    - port_service_map
    - discovered_credentials
  outputs:
    - service_vulnerabilities
    - credential_findings
    - ad_attack_paths
    - network_topology_map
  hitl_required: true
  hitl_checkpoints:
    - "Before ANY exploitation attempt"
    - "Before credential brute-forcing"
    - "Before LLMNR/NBT-NS poisoning"
    - "Before lateral movement"
  max_runtime_minutes: 120
  priority: 3
  depends_on:
    - recon_active_agent

ssl_scanner_agent:
  name: "SCANNER-SSL"
  role: "SSL/TLS Security Analyst"
  description: >-
    Analyzes TLS configuration, certificate validity, cipher suites,
    protocol versions, and known TLS vulnerabilities.
  frameworks:
    mitre_attack: [T1040, T1573, T1557]
    nist_csf: [PR.DS-02, PR.DS-05]
    d3fend: [D3-CTA, D3-CH]
  skills:
    - ssl-tls-testing
    - scope-management
    - evidence-collection
  tools_required:
    - testssl.sh
    - sslscan
    - sslyze
    - openssl
    - nmap
  inputs:
    - scope_definition
    - tls_endpoints
  outputs:
    - tls_grade
    - protocol_matrix
    - cipher_analysis
    - certificate_findings
    - vulnerability_findings
  hitl_required: false
  max_runtime_minutes: 30
  priority: 3
  depends_on:
    - recon_active_agent

vuln_scanner_agent:
  name: "SCANNER-VULN"
  role: "Vulnerability Scanner"
  description: >-
    Runs automated vulnerability assessments using template-based
    scanners. CVE correlation and false positive validation.
  frameworks:
    mitre_attack: [T1595.002, T1190]
    nist_csf: [DE.CM-08, ID.RA-02]
    d3fend: [D3-VDA, D3-SPM]
  skills:
    - vulnerability-scanning
    - scope-management
    - memory-management
    - evidence-collection
  tools_required:
    - nuclei
    - nikto
    - searchsploit
    - nmap
  inputs:
    - scope_definition
    - port_service_map
    - technology_stack
  outputs:
    - vulnerability_list
    - cve_correlations
    - exploitability_assessment
    - false_positive_analysis
  hitl_required: false
  max_runtime_minutes: 60
  priority: 3
  depends_on:
    - recon_active_agent

cloud_scanner_agent:
  name: "SCANNER-CLOUD"
  role: "Cloud Security Tester"
  description: >-
    Tests cloud infrastructure for misconfigurations. AWS, Azure, GCP
    storage buckets, IAM analysis, metadata access.
  frameworks:
    mitre_attack: [T1580, T1530, T1078.004]
    nist_csf: [PR.AC-06, PR.DS-01]
    d3fend: [D3-CSM, D3-IAM]
  skills:
    - cloud-testing
    - scope-management
    - memory-management
    - evidence-collection
  tools_required:
    - aws-cli
    - az-cli
    - gcloud
    - ScoutSuite
    - Prowler
    - Pacu
    - S3Scanner
  inputs:
    - scope_definition
    - cloud_provider
    - cloud_credentials
    - ssrf_endpoints
  outputs:
    - bucket_findings
    - iam_findings
    - metadata_findings
    - misconfiguration_list
  hitl_required: true
  hitl_checkpoints:
    - "Before any cloud exploitation"
    - "Before IAM privilege escalation"
  max_runtime_minutes: 60
  priority: 3
  depends_on:
    - recon_active_agent

# ═══════════════════════════════════════════════════════════
# EXPLOITER SWARM
# ═══════════════════════════════════════════════════════════

exploit_agent:
  name: "EXPLOITER"
  role: "Exploitation Specialist"
  description: >-
    Attempts exploitation of confirmed vulnerabilities. Crafts payloads,
    bypasses defenses, demonstrates impact. ALWAYS requires operator approval.
  frameworks:
    mitre_attack: [T1059, T1203, T1068]
    nist_csf: [PR.PT-02, RS.AN-03]
    d3fend: [D3-EAA, D3-PEA]
  skills:
    - payload-crafting
    - hunting
    - privilege-escalation
    - scope-management
    - memory-management
    - evidence-collection
  tools_required:
    - metasploit
    - sqlmap
    - commix
    - msfvenom
    - john
    - hashcat
  inputs:
    - approved_findings
    - operator_decisions
    - target_details
  outputs:
    - exploitation_results
    - access_gained
    - impact_assessment
    - evidence_artifacts
  hitl_required: true
  hitl_checkpoints:
    - "Before EVERY exploitation attempt"
    - "Before privilege escalation"
    - "Before lateral movement"
    - "Before data access demonstration"
  max_runtime_minutes: 180
  priority: 4
  depends_on:
    - webapp_scanner_agent
    - api_scanner_agent
    - network_scanner_agent
    - vuln_scanner_agent
    - ai_scanner_agent

# ═══════════════════════════════════════════════════════════
# ANALYSIS & REPORTING
# ═══════════════════════════════════════════════════════════

hunter_agent:
  name: "HUNTER"
  role: "Threat Hunter & Chain Builder"
  description: >-
    Goes beyond automated scanning. Finds logic flaws, chained vulns,
    zero-day patterns, and complex attack paths.
  frameworks:
    mitre_attack: [T1203, T1059, T1562]
    nist_csf: [DE.AE-01, RS.AN-03]
    d3fend: [D3-THA, D3-MCI]
  skills:
    - hunting
    - attack-chain-analysis
    - memory-management
    - evidence-collection
  inputs:
    - all_findings
    - asset_inventory
    - technology_stack
  outputs:
    - attack_chains
    - logic_flaw_findings
    - compound_risk_assessment
    - novel_findings
  hitl_required: true
  max_runtime_minutes: 120
  priority: 4
  depends_on:
    - vuln_scanner_agent
    - webapp_scanner_agent
    - ai_scanner_agent

reporter_agent:
  name: "REPORTER"
  role: "Report Generator"
  description: >-
    Compiles all findings into structured reports. Executive summaries,
    detailed walkthroughs, remediation roadmaps, and Telegram updates.
  skills:
    - reporting
    - remediation-advisor
    - attack-chain-analysis
    - telegram-hitl
    - evidence-collection
  inputs:
    - all_findings
    - evidence_artifacts
    - attack_chains
    - operator_decisions
    - engagement_timeline
  outputs:
    - executive_report
    - technical_report
    - remediation_roadmap
    - telegram_summary
  hitl_required: false
  max_runtime_minutes: 30
  priority: 5
  depends_on:
    - all_scanner_agents
    - exploit_agent
    - hunter_agent

# ═══════════════════════════════════════════════════════════
# ORCHESTRATOR (NIGHTFANG Master)
# ═══════════════════════════════════════════════════════════

nightfang_orchestrator:
  name: "NIGHTFANG"
  role: "Engagement Orchestrator"
  description: >-
    The master orchestrator. Manages engagement lifecycle, delegates
    tasks to swarm agents, handles Telegram HITL, maintains memory,
    enforces scope, and tracks MITRE ATT&CK/D3FEND mappings.
  skills:
    - scope-management
    - memory-management
    - telegram-hitl
    - token-optimizer
    - attack-chain-analysis
    - evidence-collection
    - reporting
  agent_spawn_order:
    phase_1_recon:
      - recon_passive_agent
    phase_2_active_recon:
      - recon_active_agent
    phase_3_scanning:
      - webapp_scanner_agent
      - api_scanner_agent
      - ai_scanner_agent
      - network_scanner_agent
      - ssl_scanner_agent
      - vuln_scanner_agent
      - cloud_scanner_agent
    phase_4_analysis:
      - hunter_agent
    phase_5_exploitation:
      - exploit_agent
    phase_6_reporting:
      - reporter_agent
