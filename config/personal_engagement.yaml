# AEGIS Personal Engagement Configuration Template
# Extends HERMES config/engagement_template.yaml with operator-specific defaults
# Tuned to .env: secrets automatically resolve from your .env file!

engagement:
  name: "Personal Security Assessment"
  client: "Target Organization"
  type: "greybox"              # blackbox | greybox | whitebox
  start_date: ""               # YYYY-MM-DD
  end_date: ""                 # YYYY-MM-DD
  operator: "${HERMES_OPERATOR:@SecurityLead}"
  aegis_version: "1.0.0"

# ─────────────────────────────────────────────────────
# SCOPE DEFINITION (Operator-specific defaults)
# ─────────────────────────────────────────────────────
scope:
  in_scope:
    domains:
      - "*.example.com"
      - "api.example.com"
      - "app.example.com"
      - "staging.example.com"
    ips:
      - "192.168.1.0/24"
      - "10.0.0.0/16"
    urls:
      - "https://app.example.com/*"
      - "https://api.example.com/v1/*"
      - "https://staging.example.com/*"
      - "https://graphql.example.com/*"
    ports:
      - "80,443,8080,8443,3000,4000,5000,8000,9000"
    # AEGIS-specific: API specifications
    api_specs:
      - "https://api.example.com/openapi.json"
      - "https://graphql.example.com/schema.graphql"
    # AEGIS-specific: AI/LLM endpoints
    ai_endpoints:
      - "https://api.example.com/v1/ai/assistant"
      - "https://api.example.com/v1/ai/chat"

  out_of_scope:
    domains:
      - "production-db.example.com"
      - "payments.example.com"
      - "billing.example.com"
      - "*.rds.amazonaws.com"
      - "*.database.windows.net"
      - "*.cloudsql.googleapis.com"
    ips:
      - "192.168.1.1"            # Gateway
      - "10.0.0.1"               # Core router
    urls:
      - "*/admin/purge*"
      - "*/admin/delete*"
      - "*/admin/reset*"
      - "*payment*"
      - "*billing*"
      - "*checkout*"
    notes:
      - "Strictly no denial of service or resource exhaustion testing."
      - "Do not alter live financial records or user data."
      - "No social engineering or phishing simulations."
      - "No testing of third-party SaaS without written addendum."
      - "Respect all rate limits and WAF signals — back off on 429/503."

# ─────────────────────────────────────────────────────
# CREDENTIALS (Greybox/Whitebox) — References .env only!
# ─────────────────────────────────────────────────────
credentials:
  - role: "standard_user"
    username: "${TEST_USER_STANDARD}"
    password: "${TEST_PASS_STANDARD}"
    totp_secret: "${TEST_TOTP_STANDARD}"
  
  - role: "premium_user"
    username: "${TEST_USER_PREMIUM}"
    password: "${TEST_PASS_PREMIUM}"
  
  - role: "api_consumer"
    api_key: "${TEST_API_KEY_CONSUMER}"
    api_secret: "${TEST_API_SECRET_CONSUMER}"
  
  - role: "graphql_user"
    jwt_token: "${TEST_GRAPHQL_JWT}"
  
  - role: "ai_assistant_user"
    session_token: "${TEST_AI_SESSION_TOKEN}"

# ─────────────────────────────────────────────────────
# RULES OF ENGAGEMENT & PERFORMANCE (AEGIS Calibrated)
# ─────────────────────────────────────────────────────
rules:
  testing_window: "24/7"
  max_scan_rate: 150             # AEGIS default: higher than HERMES baseline
  stealth_mode: false
  auto_exploit: false            # ALWAYS FALSE — exploitation requires HITL /go
  
  # Token Optimization (Caveman Mode)
  token_efficiency: ${HERMES_TOKEN_EFFICIENCY:false}
  
  # AEGIS-specific: Custom wordlists & templates
  custom_wordlists:
    directories: "~/wordlists/raft-medium-directories.txt,~/wordlists/custom-api-endpoints.txt"
    parameters: "~/wordlists/arjun-params.txt,~/wordlists/custom-graphql-fields.txt"
    fuzzing: "~/wordlists/fuzzdb/attack/*"
  
  custom_nuclei_templates:
    - "~/nuclei-templates-custom/ai-llm/"
    - "~/nuclei-templates-custom/business-logic/"
    - "~/nuclei-templates-custom/cloud-metadata/"
  
  allowed_techniques:
    - passive_recon
    - active_recon
    - vulnerability_scanning
    - web_app_testing
    - api_testing
    - ai_llm_testing
    - network_testing
    - cloud_testing
    - ssl_tls_testing
  
  # AEGIS-specific: Technique-specific configs
  technique_config:
    passive_recon:
      subfinder_sources: "all"
      amass_intel: true
      crtsh_depth: 3
      github_dorks: true
    
    active_recon:
      nmap_timing: "T4"
      nmap_flags: "-sS -sV -sC --version-intensity 5 --min-rate 2000"
      masscan_rate: 5000
      udp_top_ports: "53,67,68,69,123,161,162,500,514,520,631,1434,1900,4500,5353"
    
    web_app_testing:
      ffuf_threads: 50
      ffuf_rate: 100
      katana_depth: 3
      katana_flags: "-jc -kf all -ef woff,woff2,ttf,png,jpg,css,js,map"
      nuclei_tags: "cve,misconfig,exposures,tech,fuzz"
    
    api_testing:
      kiterunner_wordlist: "~/wordlists/kiterunner-routes.txt"
      graphql_introspection: true
      graphql_field_suggestions: true
      jwt_algorithm_test: ["HS256", "RS256", "none"]
      mass_assignment_test: true
    
    ai_llm_testing:
      prompt_injection_corpus: "~/prompts/injection-corpus.txt"
      system_prompt_extraction: true
      tool_calling_abuse: true
      rag_poisoning_test: true
      mcp_audit: true
    
    network_testing:
      smb_signing_check: true
      ldap_enum: true
      kerberos_enum: true
      bloodhound_collection: true
      crackmapexec_modules: "smb,ldap,ssh,rdp,winrm"
    
    cloud_testing:
      aws_regions: "us-east-1,us-west-2,eu-west-1"
      azure_subscriptions: "${AZURE_SUB_IDS}"
      gcp_projects: "${GCP_PROJECT_IDS}"
      prowler_checks: "all"
      scoutsuite_services: "all"

  reporting:
    format: "markdown"
    telegram_updates: true
    update_frequency: "per_finding"    # per_finding | per_phase | digest
    include_evidence: true
    map_mitre_attack: true
    map_mitre_atlas: true
    map_d3fend: true
    map_nist_csf: true
    map_cwe: true
    cvss_version: "3.1"
    executive_summary_first: true
    technical_depth: "full"
    mermaid_diagrams: true

# ─────────────────────────────────────────────────────
# TELEGRAM BOT (Sole Communication & HITL Channel)
# ─────────────────────────────────────────────────────
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
  parse_mode: "Markdown"
  notify_on:
    - findings
    - phase_changes
    - permission_requests
    - engagement_complete
    - scope_violations
    - rate_limit_events
  # AEGIS-specific: Compact mode for mobile
  compact_mode: true
  max_message_length: 4000

# ─────────────────────────────────────────────────────
# AGENT SWARM CONFIGURATION (AEGIS Enhanced)
# ─────────────────────────────────────────────────────
agent:
  max_concurrent_agents: ${HERMES_MAX_CONCURRENT_AGENTS:7}
  timeout_per_task: 3600
  retry_on_failure: true
  max_retries: 3
  mcp_config_path: "config/mcp_servers.yaml"
  
  # AEGIS-specific: Agent calibration
  calibration:
    nmap_timing_override: "T4"
    ffuf_rate_override: 150
    nuclei_concurrency: 25
    sqlmap_risk_level: 2
    sqlmap_level: 3
    katana_crawl_depth: 3
    subfinder_timeout: 300
    amass_timeout: 600

# ─────────────────────────────────────────────────────
# AEGIS PERSONAL INTEGRATION
# ─────────────────────────────────────────────────────
aegis:
  soul_file: "SOUL.md"
  memory_file: "PERSONAL_MEMORY.md"
  operator_profile: "OPERATOR_PROFILE.md"
  personal_subagents: "config/personal_subagents.yaml"
  personal_workflows: "config/personal_workflows.yaml"
  
  # Memory sync
  sync_personal_memory: true
  sync_interval_minutes: 5
  
  # Learned evasion profiles (from PERSONAL_MEMORY.md)
  use_learned_evasion: true
  evasion_profile_source: "PERSONAL_MEMORY.md:target_signatures"
  
  # Attack chain templates (from PERSONAL_MEMORY.md)
  use_chain_templates: true
  chain_template_source: "PERSONAL_MEMORY.md:attack_chain_templates"
  
  # Tool effectiveness calibration
  use_tool_calibration: true
  calibration_source: "PERSONAL_MEMORY.md:tool_effectiveness"
  
  # Custom hooks
  pre_scan_hook: "scripts/aegis_pre_scan.py"
  post_finding_hook: "scripts/aegis_post_finding.py"
  pre_exploit_hook: "scripts/aegis_pre_exploit.py"
  post_engagement_hook: "scripts/aegis_post_engagement.py"