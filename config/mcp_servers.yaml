# OPENCLAW / HERMES — Model Context Protocol (MCP) Server Registry
# Connects HERMES to external tools, browser engines, and threat intel feeds

mcp_servers:
  # ─────────────────────────────────────────────────────
  # BROWSER AUTOMATION (Playwright / Puppeteer)
  # ─────────────────────────────────────────────────────
  browser_automation:
    enabled: true
    description: "Headless browser automation for dynamic DOM inspection, screenshot capture, and SPA crawling"
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-puppeteer"
    capabilities:
      - navigate
      - screenshot
      - click
      - fill
      - evaluate_js

  # ─────────────────────────────────────────────────────
  # THREAT INTELLIGENCE & OSINT (Shodan / Censys)
  # ─────────────────────────────────────────────────────
  shodan_intel:
    enabled: false
    description: "Query Internet-wide scan data and banner intelligence"
    command: "python"
    args:
      - "-m"
      - "mcp_server_shodan"
    env:
      SHODAN_API_KEY: "${SHODAN_API_KEY}"
    capabilities:
      - host_lookup
      - search_banners
      - exploit_search

  # ─────────────────────────────────────────────────────
  # FILE SYSTEM & ARTIFACT VAULT
  # ─────────────────────────────────────────────────────
  filesystem_vault:
    enabled: true
    description: "Sandboxed evidence storage and engagement logs access"
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "engagements"
    capabilities:
      - read_file
      - write_file
      - list_directory
